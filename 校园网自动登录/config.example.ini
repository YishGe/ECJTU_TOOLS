# ===== 校园网自动登录 · 配置示例 =====
#
# 首次使用：双击「校园网配置.exe」→ 填好账号、密码、选运营商 → 点「保存设置」，
# 程序会在同目录生成 config.ini（你的真实配置，已被 .gitignore 忽略）。
# 也可以把本文件直接复制成 config.ini，再用记事本修改。
#
# 说明：config.ini 存在时优先读它；不存在时读本示例文件。

# 账号：学号 / 上网账号（按学校实际填写）
账号=

# 密码：可写明文；图形工具保存时会写成 b64:<Base64> 形式（仅防止旁人一眼看到，不是加密）
密码=

# 运营商后缀：中国电信 @telecom / 中国移动 @cmcc / 中国联通 @unicom / 没有就留空
运营商=

# 开机自动登录（1=开，0=关）。开启后会写入 HKCU\...\Run，不需要管理员权限
开机自启=0

# 开机后等待多少秒再开始连接
开机延时秒=6

# 最多尝试几次（含第一次）
重试次数=8

# 两次尝试之间间隔多少秒
重试间隔秒=5

# 已经能上网时直接跳过登录（1=跳过）。强烈建议保持 1，避免在 AC 上产生多余会话
已在线则跳过=1

# 认证服务器地址：改成你学校的认证门户地址（可写 IP、IP:端口 或 http://完整地址）
认证服务器=192.168.1.1

# 认证方式：auto / local = 本地认证（a70.htm 表单）；portal = PORTAL 协议（:801/eportal）
认证方式=auto

# 自助服务平台地址：遇到 code[062]（同时在线设备数超限）时会打开这个页面提醒你处理
自助服务=http://192.168.1.1:8080/Self/dashboard

# 处理完 062 之后，自动重新尝试登录几次；0 = 不重试
提醒后重试次数=2

# 每次重试之间等待多少秒
提醒后重试间隔秒=5

# 本机 MAC（高级，一般留空）：留空 = 自动识别对应 IP 的网卡；
# 若日志提示无法识别、或自助服务里总出现 00-00-00-00-00-00 的假设备，可手填如 00-1A-2B-3C-4D-5E
本机MAC=

# AC 地址 / 名称（高级，一般留空）：对应登录地址里的 wlanacip / wlanacname。
# 空 = 提交 null。若自助服务里总被记成 00-00-00-00-00-00 的假设备，
# 可从 AC 劫持跳转的地址里抄这两个值填进来。
AC地址=
AC名称=

# 睡眠/休眠唤醒后自动重连（1=开，0=关）。开启后程序会创建一个计划任务 
# CampusNetAutoLogin_Wake（监听 System 日志的 Kernel-Power 事件 107），不需要管理员权限。
唤醒重连=0
